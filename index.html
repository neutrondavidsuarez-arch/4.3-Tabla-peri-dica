    <script>

        // PRINCIPAL (Deber + Repaso) — 30 preguntas
        const quizData = [
          { question: 'Los elementos del grupo VIIA son conocidos por ser:', options: ['Altamente reactivos', 'Estables', 'Inertes', 'Semimetálicos'], answer: 'Altamente reactivos', explanation: 'Identificación de la familia del Grupo VIIA (Grupo 17 IUPAC): <br> Los elementos pertenecientes al Grupo VIIA de la tabla periódica tradicional (Grupo 17 según la convención IUPAC) son los halógenos: flúor ("F"), cloro ("Cl"), bromo ("Br"), yodo ("I"), astato ("At") y teneso ("Ts"). <br> Configuración electrónica y tendencia química: <br> Poseen una configuración electrónica de valencia ns<sup>2</sup> np<sup>5</sup>(7 electrones en su capa externa). <br> Presentan los valores de electronegatividad y afinidad electrónica más elevados de sus respectivos periodos, lo que les confiere una extrema avidez por captar un electrón adicional para completar el octeto (ns<sup>2</sup> np<sup>6</sup>). <br> Esta propiedad los convierte en agentes oxidantes potentes y en los no metales más altamente reactivos de la tabla periódica.', multi: 'OFF', maxSelect: 1 },
           { question: 'Los metales alcalinos se caracterizan por _______, es decir pierden electrones y forman iones positivos, mientras que los calcógenos se caracterizan por______, es decir ganar electrones y formar iones negativos.', options: ['Reducirse-oxidarse', 'Oxidarse-reducirse', 'Ionizarse-oxidarse', 'Ionizarse-reducirse'], answer: 'Oxidarse-reducirse', explanation: 'Establece la correlación exacta entre pérdida de electrones/formación de cationes (oxidación) y ganancia de electrones/formación de aniones (reducción).', multi: 'OFF', maxSelect: 1 },
           { question: 'Complete: <br> Los ________________ presentan carácter metálico, reaccionan con el oxígeno para formar óxidos metálicos de fórmula MO y con el agua para formar hidróxidos de fórmula M(OH)<sub>2</sub>.', options: ['alcalinos', 'alcalinos térreos', 'gases nobles ', 'halógenos '], answer: 'alcalinos térreos', explanation: 'Los metales alcalinos térreos son los que presentan carácter metálico, reaccionan con el oxígeno para formar óxidos metálicos de fórmula MO y con el agua para formar hidróxidos de fórmula M(OH)<sub>2</sub>.', multi: 'OFF', maxSelect: 1 },
           { question: 'El agua dura se caracteriza por tener sales de iones metálicos como el Mg<sup>+2</sup> y Ca<sup>+2</sup>. Este tipo de agua no presenta un riesgo para la salud, pero es inadecuada en el uso industrial, ya que, formaría incrustaciones en calderos y tuberías reduciendo su diámetro y como consecuencia se pierde presión. Respecto a los iones descritos y a sus átomos neutros, seleccione la alternativa correcta.', options: ['El radio del Mg<sup>+2</sup> es igual al del Mg.', 'El Ca presenta mayor radio atómico que el Mg.', 'El Ca presenta mayor afinidad electrónica que el Mg.', 'El radio del Mg<sup>+2</sup> es mayor al del Mg.'], answer: 'El Ca presenta mayor radio atómico que el Mg.', explanation: 'El calcio (Ca) tiene un mayor radio atómico que el magnesio (Mg) porque, en su estado neutro, posee más capas electrónicas. Al ionizarse, ambos pierden dos electrones, formando cationes Ca<sup>2+</sup> y Mg<sup>2+</sup>, pero como el calcio tenía originalmente un radio mayor, su ion sigue siendo más grande que el magnesio.', multi: 'OFF', maxSelect: 1 },
           { question: 'El carbono, el hidrogeno y el oxígeno son los elementos más abundantes en la naturaleza, ya que están formando parte de la materia viva. Existen otros elementos como el nitrógeno y fósforo que conjuntamente con el carbono, hidrógeno y oxígeno forman parte de los ácidos nucléicos. Con respecto a los elementos mostrados en la tabla (use una tabla periódica para ubicar a los elementos), seleccione la proposición correcta. <br> <img src="https://drive.google.com/thumbnail?id=19wVwlz4093Dnmg7s-NTICN1EmyzQcqLHGxWOokELc30&sz=w800-h600"width="700" height="300" alt="Descripción">', options: ['El carbono presenta menor radio atómico que el oxígeno.', 'El fósforo presenta mayor energía de ionización que el nitrógeno.', 'La afinidad electrónica del hidrógeno es igual a la del oxígeno.', 'El oxígeno presenta mayor electronegatividad que el carbono. '], answer: 'El oxígeno presenta mayor electronegatividad que el carbono. ', explanation: 'El oxígeno presenta mayor electronegatividad que el carbono, lo cual es importante para entender su papel en la formación de compuestos orgánicos y biológicos.', multi: 'OFF', maxSelect: 1 },
           { question: 'Seleccione la alternativa correcta respecto a las zonas que representa la siguiente tabla periódica: <br> Zona W (Eu), Zona X (Ca), Zona Y (Fe) y Zona Z (S) <br> <img src="https://drive.google.com/thumbnail?id=12u7bPW11xVC9VkaOzfS5rnjE78seeTk2ZuT2VSXAsA8&sz=w800-h600"width="450" height="300" alt="Descripción">', options: ['A la zona Z pertenecen los elementos de transición interna.', 'Las zonas X, Z, Y, W, pertenecen a los elementos que contiene electrones en los subniveles s, p, d, f respectivamente.', 'Las zonas X y W pertenecen a los elementos representativos.', 'En la zona W podemos encontrar a los gases nobles. '], answer: 'Las zonas X, Z, Y, W, pertenecen a los elementos que contiene electrones en los subniveles s, p, d, f respectivamente.', explanation: 'Las zonas X, Y, Z y W pertenecen a los elementos que contienen electrones en los subniveles s, p, d y f respectivamente, lo que refleja su configuración electrónica.', multi: 'OFF', maxSelect: 1 },
           { question: 'Los números cuánticos del último electrón de un átomo son 2; 1; +1; +1/2.  Determine a que grupo y periodo pertenece el elemento químico.', options: ['VA y 2', 'VB y 2', 'IVA y 3', 'IIIB y 3'], answer: 'VA y 2', explanation: 'El elemento químico con números cuánticos del último electrón como 2; 1; +1; +1/2 pertenece al grupo VA y periodo 2, indicando su posición en la tabla periódica.', multi: 'OFF', maxSelect: 1 },
           { question: 'Determine la alternativa correcta respecto a los elementos Na (11), Al (13), P (15), S (16), Cl (17), Ca (20), I (53), Fr (87) <br> Nota: Pude ver la ubicación en una tabla periódica. <br> <img src="https://drive.google.com/thumbnail?id=1rsHd_r-BQYYTnNSXqSmMuxcrVdCIiA93syi5UC3-Nfc&sz=w800-h600"width="600" height="300" alt="Descripción">', options: ['El sodio presenta mayor radio atómico que el francio.', 'El yodo presenta mayor electronegatividad  que el cloro.', 'El sodio presenta mayor radio atómico que el cloro.', 'El aluminio presenta mayor energía de ionización que el azufre. '], answer: 'El sodio presenta mayor radio atómico que el cloro.', explanation: 'El sodio presenta mayor radio atómico que el cloro debido a su posición en la tabla periódica donde los metales generalmente tienen radios más grandes que los no metales.', multi: 'OFF', maxSelect: 1 },
           { question: 'Determine la alternativa correcta respecto a la tabla periódica.', options: ['Los halógenos o calcógenos pertenecen al grupo IA.', 'Los anfígenos pertenecen al grupo VIB.', 'Los metales alcalinos pertenecen al bloque d.', 'Los gases nobles son del grupo 18 en la Tabla Periódica Moderna.'], answer: 'Los gases nobles son del grupo 18 en la Tabla Periódica Moderna.', explanation: 'Los gases nobles son del grupo 18 en la Tabla Periódica Moderna; son conocidos por su estabilidad química y baja reactividad.', multi: 'OFF', maxSelect: 1 },
           { question: 'El ión sodio Na<sup>+1</sup> presenta 10 electrones en su distribución electrónica. Determine al grupo que pertenece el átomo neutro de sodio. ', options: ['Alcalinos', 'Anfígenos', 'Halógenos', 'Alcalinotérreos'], answer: 'Alcalinos', explanation: 'El ion sodio Na<sup>+</sup> presenta 10 electrones en su distribución electrónica, indicando que el átomo neutro de sodio pertenece al grupo de los metales alcalinos.', multi: 'OFF', maxSelect: 1 },
           { question: 'En la tabla periódica se puede encontrar a los metales y no metales. Los metales se caracterizan por ser buenos conductores del calor y la electricidad, mientras que los no metales se caracterizan por:', options: ['Oxidarse fácilmente, es decir pierden electrones con facilidad.', 'Ser dúctiles, maleables y reflejan la luz.', 'Estar en estado sólido, líquido y gaseoso, además son malos conductores de la electricidad.', 'Ser buenos conductores del calor.'], answer: 'Estar en estado sólido, líquido y gaseoso, además son malos conductores de la electricidad.', explanation: 'Los no metales se caracterizan por estar en estado sólido, líquido y gaseoso; además son malos conductores de la electricidad, lo que los distingue de los metales.', multi: 'OFF', maxSelect: 1 },
           { question: 'El bronce es una de las aleaciones más antiguas de la prehistoria, y se forma a partir del cobre y estaño. En la actualidad es muy utilizado en la fabricación de monedas, herramientas y piezas industriales como las turbinas. Con respecto a los metales, seleccione las características correctas del elemento mencionado. <br> I. Su fuerza se debe a la atracción entre los cationes y la nube electrónica. <br> II. Se presenta entre átomos de alta electronegatividad y baja energía de ionización. <br> III. Poseen altos puntos de fusión comparados con el agua. <br> IV. Compuestos con este enlace son fácilmente deformables por acción de una fuerza externa.', options: ['I, III', 'I, IV', 'II, III', 'I, II'], answer: 'I, IV', explanation: 'La fuerza del bronce se debe a la atracción entre los cationes y la nube electrónica; esta propiedad le confiere alta conductividad y maleabilidad pudiéndose deformar con facilidad.', multi: 'OFF', maxSelect: 1 },
           { question: 'Los gases nobles son conocidos por ser:', options: ['Reactivos y formadores de compuestos fácilmente.', 'Estables y tener una alta electronegatividad.', 'Incoloros e inodoros a temperatura ambiente.', 'Metales pesados'], answer: 'Incoloros e inodoros a temperatura ambiente.', explanation: 'Describe fielmente el estado físico y las propiedades organolépticas macroscópicas universales de la familia de los gases nobles.', multi: 'OFF', maxSelect: 1 },
           { question: 'El elemento con mayor electronegatividad es generalmente:', options: ['Francio (Fr)', 'Flúor (F)', 'Oxígeno (O)', 'Cloro (Cl)'], answer: 'Flúor (F)', explanation: 'Explicación: La electronegatividad es la medida de la capacidad relativa de un átomo para atraer hacia sí el par de electrones compartidos en un enlace químico. <br> En un periodo (fila horizontal): Aumenta de izquierda a derecha debido al incremento de la carga nuclear efectiva, lo que atrae a la nube electrónica con mayor fuerza. <br> En un grupo (columna vertical): Aumenta de abajo hacia arriba debido a la disminución del radio atómico y la menor apantallamiento de las capas electrónicas internas. <br> Al excluir a los gases nobles (que generalmente no forman enlaces covalentes estándar), el elemento ubicado en la esquina superior derecha del bloque de no metales es el flúor ("F").', multi: 'OFF', maxSelect: 1 },
           { question: 'Los elementos en la tabla periódica están ordenados principalmente por:', options: ['Masa atómica', 'Número de neutrones', 'Número atómico (Z)', 'Propiedades químicas'], answer: 'Número atómico (Z)', explanation: 'Ley Periódica Moderna: Moseley (1913) demostró que las propiedades de los elementos dependen de su número atómico (𝑍, cantidad de protones). <br> Ordenamiento actual: La tabla se secuencia en orden creciente de 𝑍(1,2,3…), lo que determina su configuración electrónica y comportamiento químico.', multi: 'OFF', maxSelect: 1 },
           { question: '¿Qué indica un período en la tabla periódica?', options: ['El número de protones', 'La cantidad de electrones de valencia', 'El último nivel de energía ocupado por los electrones', 'La reactividad del elemento'], answer: 'El último nivel de energía ocupado por los electrones', explanation: 'Un período en la tabla periódica indica el último nivel de energía ocupado por los electrones; esto ayuda a entender las características electrónicas de los elementos.', multi: 'OFF', maxSelect: 1 },
           { question: '¿Cuántos grupos o familias hay en la tabla periódica moderna?', options: ['10', '12', '16', '18'], answer: '18', explanation: 'Hay un total de 18 grupos o familias en la tabla periódica moderna, cada uno con propiedades químicas similares debido a configuraciones electrónicas similares.', multi: 'OFF', maxSelect: 1 },
           { question: 'Los elementos del Grupo IA se conocen como:', options: ['Halógenos', 'Gases nobles', 'Alcalinos', 'Anfígenos'], answer: 'Alcalinos', explanation: 'Los elementos del Grupo IA se conocen como metales alcalinos, caracterizados por ser altamente reactivos y tener un solo electrón en su capa externa.', multi: 'OFF', maxSelect: 1 },
           { question: 'Los elementos del Grupo VIIA son conocidos como:', options: ['Halógenos', 'Gases nobles', 'Alcalinos', 'Anfígenos'], answer: 'Halógenos', explanation: 'Los elementos del Grupo VIIA son conocidos como halógenos; son altamente reactivos y tienden a formar compuestos con metales al ganar electrones.', multi: 'OFF', maxSelect: 1 },
           { question: '¿Qué subnivel termina la configuración electrónica de los elementos del Grupo A?', options: ['s y d', 's y p', 'd y f', 'p y f'], answer: 's y p', explanation: 'La configuración electrónica de los elementos del Grupo A termina en los subniveles s y p, reflejando sus características químicas específicas.', multi: 'OFF', maxSelect: 1 },
           { question: 'Los elementos de transición se encuentran en:', options: ['Zona d', 'Zona p', 'Zona f ', 'Zona s'], answer: 'Zona d', explanation: 'Dentro de la tabla periódica se va a encontrar a los elementos de transición en la zona d, lo que permite determinar la configuración electrónica de estos elementos. <br> <img src="https://drive.google.com/thumbnail?id=1gT0vLBma4NnYNeHL7UQuKTXoFXxflidM8fO2S_Y4Gmk&sz=w800-h600"width="600" height="300" alt="Descripción">', multi: 'OFF', maxSelect: 1 },
           { question: 'La configuración electrónica del cobalto (Co, Z=27) es:', options: ['[18Ar] 4s<sup>2</sup> 3d<sup>7</sup>', '[36Kr] 5s<sup>2</sup> 4d<sup>3</sup>', '[10Ne] 3s<sup>2</sup> 3p<sup>5</sup>', '[18Ar] 4s<sup>2</sup> 4p<sup>3</sup>'], answer: '[18Ar] 4s<sup>2</sup> 3d<sup>7</sup>', explanation: 'La configuración electrónica del cobalto (Co) es [18Ar] 4s<sup>2</sup> 3d<sup>7</sup>; esta disposición muestra cómo se distribuyen los electrones en sus niveles energéticos.', multi: 'OFF', maxSelect: 1 },
           { question: 'Los metales son generalmente', options: ['Malos conductores del calor y la electricidad.', 'Sólidos a temperatura ambiente, excepto el mercurio.', 'Quebradizos en estado sólido.', 'Tienden a ganar electrones.'], answer: 'Sólidos a temperatura ambiente, excepto el mercurio.', explanation: 'Los metales son generalmente sólidos a temperatura ambiente, excepto el mercurio; esto les confiere propiedades físicas distintivas frente a otros tipos de elementos.', multi: 'OFF', maxSelect: 1 },
           { question: 'Un ejemplo de un elemento no metálico es:', options: ['Hierro (Fe)', 'Oxígeno (O)', 'Cobre (Cu)', 'Aluminio (Al)'], answer: 'Oxígeno (O)', explanation: 'Un ejemplo de un elemento no metálico es el oxígeno (O), que es esencial para la vida y se encuentra como gas a temperatura ambiente.', multi: 'OFF', maxSelect: 1 },
           { question: 'Los semimetales tienen propiedades que son:', options: ['Exclusivamente metálicas.', 'Exclusivamente no metálicas.', 'Intermedias entre metales y no metales.', 'Ninguna de las anteriores.'], answer: 'Intermedias entre metales y no metales.', explanation: 'Los semimetales tienen propiedades intermedias entre metales y no metales; pueden conducir electricidad pero no tan bien como los metales puros.', multi: 'OFF', maxSelect: 1 },
           { question: 'El radio atómico generalmente:', options: ['Disminuye al descender en un grupo.', 'Aumenta al moverse hacia la derecha en un período.', 'Disminuye al moverse hacia la derecha en un período.', 'Permanece constante en toda la tabla.'], answer: 'Disminuye al moverse hacia la derecha en un período.', explanation: 'El radio atómico generalmente disminuye al moverse hacia la derecha en un período debido al aumento de carga nuclear efectiva sobre los electrones externos. <br> <img src="https://drive.google.com/thumbnail?id=1MTTUNX3ijKK8ZYkAil_UppeYO0eisvmcdxfRaHeUhFM&sz=w800-h600"width="450" height="240" alt="Descripción">', multi: 'OFF', maxSelect: 1 },
           { question: 'La energía de ionización se refiere a:', options: ['La energía necesaria para ganar un electrón.', 'La energía necesaria para perder un electrón.', 'La energía liberada al formar un anión.', 'La energía requerida para fusionar átomos.'], answer: 'La energía necesaria para perder un electrón.', explanation: 'La energía de ionización se refiere a la energía necesaria para perder un electrón; es una propiedad importante para entender reactividad química. <br> <img src="https://drive.google.com/thumbnail?id=1No_Zt0_XIv8LOe4TBZLLD2NfdrYQqURI-IW0uY2Y8FY&sz=w800-h600"width="550" height="300" alt="Descripción">', multi: 'OFF', maxSelect: 1 },
           { question: 'La afinidad electrónica es:', options: ['La energía necesaria para ionizar un átomo.', 'El cambio energético cuando un átomo acepta un electrón.', 'La capacidad de atraer electrones en un enlace químico.', 'La tendencia a perder electrones.'], answer: 'El cambio energético cuando un átomo acepta un electrón.', explanation: 'La afinidad electrónica es el cambio energético cuando un átomo acepta un electrón; indica cuán fácilmente un elemento puede formar aniones. <br> <img src="https://drive.google.com/thumbnail?id=1esnmIN0PK7wnLi3cf5cJVcve8yN4_eo7iE3ehT1BzAg&sz=w800-h600"width="550" height="300" alt="Descripción">', multi: 'OFF', maxSelect: 1 },
           { question: 'La electronegatividad aumenta generalmente:', options: ['Al descender en un grupo.', 'Al moverse hacia la izquierda en un período.', 'Al moverse hacia la derecha en un período.', 'Es igual para todos'], answer: 'Al moverse hacia la derecha en un período.', explanation: 'La afinidad electrónica es el cambio energético cuando un átomo acepta un electrón; indica cuán fácilmente un elemento puede formar aniones. <br> <img src="https://drive.google.com/thumbnail?id=1NfrA3K0OigpDqce67czeGW_-2DcHmh4wtRtYOlfARdU&sz=w800-h600"width="550" height="300" alt="Descripción">', multi: 'OFF', maxSelect: 1 },
           { question: 'El carácter metálico tiende a:', options: ['Disminuir al descender en un grupo.', 'Aumentar al moverse hacia la derecha en un período.', 'Disminuir al moverse hacia la izquierda en un período.', 'Aumenta al descender en un grupo.'], answer: 'Aumenta al descender en un grupo.', explanation: 'El carácter metálico tiende a aumentar al descender en un grupo porque los electrones externos están más alejados del núcleo y son más fáciles de perder. <br> <img src="https://drive.google.com/thumbnail?id=1BQWwbOweawwgBsmxI2PJfsyOftMyHgI6_JKab7L5Fsc&sz=w800-h600"width="550" height="300" alt="Descripción">', multi: 'OFF', maxSelect: 1 },
        ];

        // Práctica — 20 preguntas
        const quizDataExtra = [
          { question: 'El helio (He Z=2), aunque es un gas noble, tiene una configuración electrónica que termina en:', options: ['s²', 'p⁶', 's¹', 's²p⁶'], answer: 's²', explanation: 'El helio tiene una configuración electrónica terminando en s<sup>2</sup>; aunque es un gas noble, esta configuración le confiere estabilidad química.', multi: 'OFF', maxSelect: 1 },
           { question: 'Los elementos que tienen electrones en el subnivel f pertenecen a:', options: ['Grupo IIA', 'Elementos de transición interna', 'Gases nobles', 'Halógenos'], answer: 'Elementos de transición interna', explanation: 'Los elementos con electrones en el subnivel f pertenecen a los elementos de transición interna; estos incluyen lantánidos y actínidos, conocidos por sus propiedades únicas.', multi: 'OFF', maxSelect: 1 },

        let state = {
            currentMode: 'deber',
            view: 'quiz_home',
            studentName: '',
            studentEmail: '',
            activeQuestions: [],
            currentQuestion: 0,
            score: 0,
            selectedAnswer: null,
            isAnswerCorrect: null,
            emailStatus: null,
            emailAnalysis: null,
            emailAnalysisMsg: '',
            timeLeft: 0
        };

        let timerInterval = null;

        const disposableDomains = [
            'tempmail.com','temp-mail.org','guerrillamail.com','10minutemail.com','mailinator.com',
            'yopmail.com','throwawaymail.com','fakeinbox.com','trashmail.com','getnada.com',
            'maildrop.cc','dispostable.com','sharklasers.com','guerrillamailblock.com'
        ];
        const trustedProviders = [
            'gmail.com','googlemail.com','hotmail.com','hotmail.es','hotmail.co.uk','outlook.com',
            'outlook.es','live.com','msn.com','yahoo.com','yahoo.es','icloud.com','me.com',
            'protonmail.com','proton.me','aol.com','zoho.com','gmx.com','mail.com'
        ];

        function isValidEmailFormat(email) {
            const re = /^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)+$/;
            return re.test(email) && email.length <= 254 && !email.includes('..') && !email.startsWith('.') && !email.endsWith('.');
        }

        function analyzeEmail(email) {
            const lower = email.toLowerCase().trim();
            if (!lower) {
                return { valid: false, msg: 'Escribe un correo electrónico.' };
            }
            if (!isValidEmailFormat(lower)) {
                return { valid: false, msg: 'Formato inválido. Revisa que tenga @ y un dominio correcto.' };
            }
            const domain = lower.split('@')[1];
            if (!domain || domain.length < 3) {
                return { valid: false, msg: 'Dominio incompleto o inválido.' };
            }
            if (disposableDomains.some(d => domain === d || domain.endsWith('.' + d))) {
                return { valid: false, msg: 'Correo temporal / desechable detectado. Usa un correo real.' };
            }
            const isTrusted = trustedProviders.some(p => domain === p);
            const hasGoodTld = /\.(com|es|net|org|edu|gov|mx|ar|co|uk|de|fr|it|pt|br|cl)$/i.test(domain);
            if (!hasGoodTld && !isTrusted) {
                return { valid: false, msg: 'Dominio poco común o sospechoso. Usa Gmail, Hotmail/Outlook, Yahoo, etc.' };
            }
            let analysisText = '';
            if (domain.includes('hotmail') || domain.includes('outlook') || domain.includes('live.com') || domain.includes('msn.com')) {
                analysisText = 'Análisis: proveedor Microsoft (Hotmail/Outlook) detectado · formato correcto · dominio legítimo';
            } else if (domain.includes('gmail') || domain.includes('googlemail')) {
                analysisText = 'Análisis: proveedor Google (Gmail) detectado · formato correcto · dominio legítimo';
            } else if (isTrusted) {
                analysisText = 'Análisis: proveedor conocido · formato correcto · dominio legítimo';
            } else {
                analysisText = 'Análisis: formato válido · dominio con TLD estándar · no se detectaron patrones de correo temporal';
            }
            return { valid: true, msg: analysisText };
        }

        function showSection(section, btn) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            stopTimer();
            const app = document.getElementById('app');
            if (section === 'pdf') {
                app.innerHTML = `<div class="animate-fade-in"><h2 class="text-xl font-bold mb-4">📄 Pizarra Virtual</h2><div class="iframe-container"><iframe src="${DRIVE_PDF_URL}" width="100%" height="100%" allow="autoplay"></iframe></div></div>`;
            } else if (section === 'video') {
                app.innerHTML = `<div class="animate-fade-in"><h2 class="text-xl font-bold mb-4">🎥 Video Clase</h2><div class="iframe-container"><iframe src="${DRIVE_VIDEO_URL}" width="100%" height="100%" allow="autoplay"></iframe></div></div>`;
            }
        }

        function prepQuiz(mode, btn) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            stopTimer();
           
            state = {
                currentMode: mode,
                view: 'quiz_home',
                studentName: '',
                studentEmail: '',
                activeQuestions: [],
                currentQuestion: 0,
                score: 0,
                selectedAnswer: null,
                isAnswerCorrect: null,
                emailStatus: null,
                emailAnalysis: null,
                emailAnalysisMsg: '',
                timeLeft: 0
            };
            render();
        }

        function startQuiz() {
            if (state.currentMode === 'deber') {
                // Deber: 30 preguntas en orden
                state.activeQuestions = [...quizData];
            } else if (state.currentMode === 'evaluacion') {
                // Repaso: 10 preguntas aleatorias del banco principal
                state.activeQuestions = [...quizData]
                    .sort(() => 0.5 - Math.random())
                    .slice(0, 10);
            } else if (state.currentMode === 'extra') {
                // Práctica: 20 preguntas en orden
                state.activeQuestions = [...quizDataExtra];
            } else if (state.currentMode === 'evaluacion_final') {
                // Evaluación: 16 preguntas en orden
                state.activeQuestions = [...quizDataEvaluacion];
            }
            state.view = 'name_input';
            state.emailAnalysis = null;
            state.emailAnalysisMsg = '';
            render();
        }

        function onEmailInput() {
            const e = document.getElementById('email-in');
            if (!e) return;
            const val = e.value.trim();
            if (val.length < 5) {
                state.emailAnalysis = null;
                state.emailAnalysisMsg = '';
                updateEmailUI();
                return;
            }
            state.emailAnalysis = 'checking';
            state.emailAnalysisMsg = 'Analizando correo…';
            updateEmailUI();
            clearTimeout(window._emailCheckTimer);
            window._emailCheckTimer = setTimeout(() => {
                const result = analyzeEmail(val);
                state.emailAnalysis = result.valid ? 'valid' : 'invalid';
                state.emailAnalysisMsg = result.msg;
                updateEmailUI();
            }, 600);
        }

        function updateEmailUI() {
            const feedback = document.getElementById('email-feedback');
            const analysis = document.getElementById('email-analysis');
            const input = document.getElementById('email-in');
            if (!feedback || !analysis || !input) return;
            if (state.emailAnalysis === 'checking') {
                feedback.innerHTML = `<span class="text-slate-500 text-sm flex items-center gap-2"><span class="dot-pulse">●</span> Verificando…</span>`;
                analysis.innerHTML = `<p class="text-xs text-slate-400 mt-1">${state.emailAnalysisMsg}</p>`;
                input.classList.remove('border-red-400', 'border-emerald-400');
                input.classList.add('border-slate-300');
            } else if (state.emailAnalysis === 'invalid') {
                feedback.innerHTML = `<span class="text-red-600 text-sm font-semibold">✗ Correo no válido o inexistente</span>`;
                analysis.innerHTML = `<p class="text-xs text-red-500/80 mt-1">${state.emailAnalysisMsg}</p>`;
                input.classList.remove('border-emerald-400', 'border-slate-300');
                input.classList.add('border-red-400');
            } else if (state.emailAnalysis === 'valid') {
                feedback.innerHTML = `<span class="text-emerald-600 text-sm font-semibold">✓ Correo aceptado</span>`;
                analysis.innerHTML = `<p class="text-xs text-emerald-600/80 mt-1">${state.emailAnalysisMsg}</p>`;
                input.classList.remove('border-red-400', 'border-slate-300');
                input.classList.add('border-emerald-400');
            } else {
                feedback.innerHTML = '';
                analysis.innerHTML = '';
                input.classList.remove('border-red-400', 'border-emerald-400');
                input.classList.add('border-slate-300');
            }
        }

        function validaDatos() {
            const n = document.getElementById('name-in').value.trim();
            const e = document.getElementById('email-in').value.trim();
            if (n.length <= 2) {
                alert("Ingresa nombre completo (mínimo 3 caracteres).");
                return;
            }
            const result = analyzeEmail(e);
            state.emailAnalysis = result.valid ? 'valid' : 'invalid';
            state.emailAnalysisMsg = result.msg;
            updateEmailUI();
            if (!result.valid) return;
            state.studentName = n;
            state.studentEmail = e;
            state.view = 'playing';
            if (state.currentMode === 'evaluacion_final') {
                startTimer();
            }
            render();
        }

        // ---------- TEMPORIZADOR (solo Evaluación) ----------
        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function getTimerPhaseClass(remaining) {
            for (const phase of EVAL_TIMER_PHASES) {
                if (remaining >= phase.minSeconds) {
                    return phase.colorClass;
                }
            }
            return EVAL_TIMER_PHASES[EVAL_TIMER_PHASES.length - 1].colorClass;
        }

        function startTimer() {
            stopTimer();
            state.timeLeft = EVAL_TIMER_SECONDS;
            timerInterval = setInterval(() => {
                state.timeLeft--;
                if (state.timeLeft <= 0) {
                    state.timeLeft = 0;
                    stopTimer();
                    state.view = 'results';
                    render();
                    enviarCorreo();
                    return;
                }
                const timerEl = document.getElementById('eval-timer');
                if (timerEl) {
                    timerEl.textContent = formatTime(state.timeLeft);
                    timerEl.className = `px-3 py-1.5 rounded-xl border-2 font-black text-sm tabular-nums ${getTimerPhaseClass(state.timeLeft)}`;
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        // ---------- LÓGICA SINGLE + MULTI ----------
        function isMultiQuestion(q) {
            return q.multi === 'ON';
        }

        function arraysEqual(a, b) {
            if (!Array.isArray(a) || !Array.isArray(b)) return false;
            if (a.length !== b.length) return false;
            const sa = [...a].sort();
            const sb = [...b].sort();
            return sa.every((v, i) => v === sb[i]);
        }

        function escapeAttr(str) {
            return String(str)
                .replace(/\\/g, '\\\\')
                .replace(/'/g, "\\'")
                .replace(/"/g, '&quot;')
                .replace(/\n/g, ' ');
        }

        function handleAnswer(option) {
            if (state.isAnswerCorrect !== null) return;

            const currentQ = state.activeQuestions[state.currentQuestion];

            if (isMultiQuestion(currentQ)) {
                let selected = Array.isArray(state.selectedAnswer) ? [...state.selectedAnswer] : [];
                const idx = selected.indexOf(option);

                if (idx > -1) {
                    selected.splice(idx, 1);
                } else {
                    if (selected.length >= currentQ.maxSelect) return;
                    selected.push(option);
                }
                state.selectedAnswer = selected;
                render();
            } else {
                if (state.selectedAnswer !== null) return;
                state.selectedAnswer = option;
                state.isAnswerCorrect = (option === currentQ.answer);
                if (state.isAnswerCorrect) state.score++;
                render();
                if (state.isAnswerCorrect) {
                    setTimeout(() => nextQuestion(), 1000);
                }
            }
        }

        function checkMultiAnswer() {
            if (state.isAnswerCorrect !== null) return;

            const currentQ = state.activeQuestions[state.currentQuestion];
            if (!isMultiQuestion(currentQ)) return;

            const selected = Array.isArray(state.selectedAnswer) ? state.selectedAnswer : [];
            if (selected.length === 0) return;

            const correctAnswers = Array.isArray(currentQ.answer) ? currentQ.answer : [currentQ.answer];
            state.isAnswerCorrect = arraysEqual(selected, correctAnswers);

            if (state.isAnswerCorrect) state.score++;
            render();

            if (state.isAnswerCorrect) {
                setTimeout(() => nextQuestion(), 1000);
            }
        }

        function nextQuestion() {
            if (state.currentQuestion + 1 < state.activeQuestions.length) {
                state.currentQuestion++;
                state.selectedAnswer = null;
                state.isAnswerCorrect = null;
                render();
            } else {
                stopTimer();
                state.view = 'results';
                render();
                enviarCorreo();
            }
        }

        function enviarCorreo() {
            if (!state.studentEmail) return;
            state.emailStatus = 'sending';
            render();
            const scorePerc = Math.round((state.score / state.activeQuestions.length) * 100);
            const totalQ = state.activeQuestions.length;
            let imageUrl = '';
            let mensaje = '';
            if (scorePerc >= 90) {
                imageUrl = 'https://img.icons8.com/color/128/medal2.png';
                mensaje = `¡Excelente trabajo, ${state.studentName}! Obtuviste un resultado sobresaliente.`;
            } else if (scorePerc >= 70) {
                imageUrl = 'https://img.icons8.com/color/128/diploma.png';
                mensaje = `¡Muy bien, ${state.studentName}! Has aprobado con un buen resultado.`;
            } else if (scorePerc >= 50) {
                imageUrl = 'https://img.icons8.com/color/128/ok.png';
                mensaje = `Buen esfuerzo, ${state.studentName}. Sigue practicando para mejorar.`;
            } else {
                imageUrl = 'https://img.icons8.com/color/128/error.png';
                mensaje = `Ánimo, ${state.studentName}. Revisa el material y vuelve a intentarlo.`;
            }
            const params = {
                to_name: state.studentName,
                to_email: state.studentEmail,
                score: scorePerc,
                correct_answers: state.score,
                total_questions: totalQ,
                mode_name: state.currentMode.toUpperCase(),
                image_url: imageUrl,
                mensaje: mensaje,
                fecha: new Date().toLocaleDateString('es-ES', {
                    year: 'numeric', month: 'long', day: 'numeric',
                    hour: '2-digit', minute: '2-digit'
                })
            };
            emailjs.send("service_dhvsi72", "template_cy74x9h", params)
                .then(() => {
                    state.emailStatus = 'success';
                    render();
                })
                .catch((err) => {
                    console.error('Error EmailJS:', err);
                    state.emailStatus = 'error';
                    render();
                });
        }

        function render() {
            const app = document.getElementById('app');
           
            let modeTitle = '';
            let modeDesc = '';
            if (state.currentMode === 'deber') {
                modeTitle = '🧪 Deber';
                modeDesc = 'Resuelve las 30 preguntas del banco en orden.';
            } else if (state.currentMode === 'evaluacion') {
                modeTitle = '📝 Repaso';
                modeDesc = 'Prueba de 10 preguntas seleccionadas al azar.';
            } else if (state.currentMode === 'extra') {
                modeTitle = '📚 Práctica';
                modeDesc = 'Resuelve las 20 preguntas de práctica.';
            } else if (state.currentMode === 'evaluacion_final') {
                modeTitle = '📊 Evaluación';
                modeDesc = 'Resuelve las 16 preguntas de la Evaluación (tiempo límite: 16 min).';
            }
           
            if (state.view === 'quiz_home') {
                app.innerHTML = `
                <div class="text-center py-16 animate-fade-in bg-white rounded-[3rem] shadow-xl border">
                    <h2 class="text-4xl font-black text-slate-800 mb-2">${modeTitle}</h2>
                    <p class="text-slate-500 mb-8 text-lg">${modeDesc}</p>
                    <button onclick="startQuiz()" class="bg-emerald-600 text-white px-12 py-5 rounded-2xl font-black text-xl hover:bg-emerald-700 transition-all">
                        INICIAR
                    </button>
                </div>`;
            }

            if (state.view === 'name_input') {
                app.innerHTML = `
                <div class="max-w-md mx-auto bg-white p-10 rounded-[2.5rem] shadow-2xl animate-fade-in">
                    <h2 class="text-2xl font-black mb-6 text-center">Registro de Estudiante</h2>
                    <input id="name-in" type="text" placeholder="Nombre y Apellido completo" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl mb-4 focus:border-emerald-500 outline-none">
                   
                    <div class="relative mb-1">
                        <input id="email-in" type="email" placeholder="Correo para recibir nota (Gmail, Hotmail…)"
                               class="w-full p-4 bg-slate-50 border border-slate-300 rounded-xl focus:border-emerald-500 outline-none transition-colors"
                               oninput="onEmailInput()" onblur="onEmailInput()">
                    </div>
                   
                    <div id="email-feedback" class="min-h-[22px] mb-1"></div>
                    <div id="email-analysis" class="mb-5"></div>
                   
                    <button onclick="validaDatos()" class="w-full bg-slate-900 text-white py-4 rounded-xl font-bold hover:bg-slate-800 transition-all">
                        ENTRAR AL TEST
                    </button>
                    <p class="text-center text-[11px] text-slate-400 mt-4">Se verifica formato y se descartan correos temporales. No se envía nada hasta terminar el test.</p>
                </div>`;
                setTimeout(updateEmailUI, 50);
            }

            if (state.view === 'playing') {
                const q = state.activeQuestions[state.currentQuestion];
                const progress = ((state.currentQuestion + 1) / state.activeQuestions.length) * 100;
                const multi = isMultiQuestion(q);
                const selected = multi
                    ? (Array.isArray(state.selectedAnswer) ? state.selectedAnswer : [])
                    : (state.selectedAnswer ? [state.selectedAnswer] : []);

                const multiHint = multi
                    ? `<p class="text-sm text-sky-600 font-semibold mb-4">
                         Selección múltiple · elige ${q.maxSelect} respuesta${q.maxSelect > 1 ? 's' : ''}
                         ${selected.length > 0 ? `(${selected.length}/${q.maxSelect})` : ''}
                       </p>`
                    : '';

                // Timer solo en Evaluación (evaluacion_final)
                const timerHtml = (state.currentMode === 'evaluacion_final')
                    ? `<div id="eval-timer" class="px-3 py-1.5 rounded-xl border-2 font-black text-sm tabular-nums ${getTimerPhaseClass(state.timeLeft)}">
                           ${formatTime(state.timeLeft)}
                       </div>`
                    : '';

                app.innerHTML = `
                <div class="animate-fade-in">
                    <div class="flex justify-between items-center mb-6 px-4 gap-4">
                        <span class="font-black text-emerald-600">${state.currentQuestion + 1} / ${state.activeQuestions.length}</span>
                        <div class="flex-1 max-w-xs bg-slate-200 h-2 rounded-full overflow-hidden">
                            <div class="bg-emerald-500 h-full transition-all" style="width:${progress}%"></div>
                        </div>
                        ${timerHtml}
                    </div>
                    <div class="bg-white p-8 md:p-12 rounded-[2.5rem] shadow-xl border">
                        <h2 class="text-2xl font-bold text-slate-800 mb-2 leading-tight">${q.question}</h2>
                        ${multiHint}
                        <div class="grid gap-3">
                            ${q.options.map(opt => {
                                let style = "border-slate-100 bg-slate-50 hover:border-emerald-200";
                                const isSelected = selected.includes(opt);

                                if (state.isAnswerCorrect !== null) {
                                    if (multi) {
                                        const correctSet = Array.isArray(q.answer) ? q.answer : [q.answer];
                                        if (correctSet.includes(opt) && isSelected) {
                                            style = "border-emerald-500 bg-emerald-100 text-emerald-800";
                                        } else if (isSelected && !correctSet.includes(opt)) {
                                            style = "border-red-500 bg-red-100 text-red-800";
                                        } else if (correctSet.includes(opt) && !isSelected) {
                                            style = "border-emerald-300 bg-emerald-50 text-emerald-700";
                                        }
                                    } else {
                                        if (isSelected) {
                                            style = state.isAnswerCorrect
                                                ? "border-emerald-500 bg-emerald-100 text-emerald-800"
                                                : "border-red-500 bg-red-100 text-red-800";
                                        } else if (opt === q.answer) {
                                            // Mostrar la correcta si el usuario falló
                                            style = "border-emerald-300 bg-emerald-50 text-emerald-700";
                                        }
                                    }
                                } else if (isSelected) {
                                    if (multi) {
                                        style = "border-sky-400 bg-sky-100 text-sky-800";
                                    } else {
                                        style = "border-emerald-500 bg-emerald-100 text-emerald-800";
                                    }
                                }

                                return `<button onclick="handleAnswer('${escapeAttr(opt)}')" 
                                            class="p-5 text-left border-2 rounded-xl font-bold transition-all ${style}">
                                            ${opt}
                                        </button>`;
                            }).join('')}
                        </div>

                        ${multi && state.isAnswerCorrect === null ? `
                            <button onclick="checkMultiAnswer()" 
                                class="mt-6 w-full py-4 rounded-xl font-bold transition-all
                                ${selected.length === q.maxSelect 
                                    ? 'bg-sky-600 text-white hover:bg-sky-700' 
                                    : 'bg-slate-200 text-slate-400 cursor-not-allowed'}"
                                ${selected.length !== q.maxSelect ? 'disabled' : ''}>
                                Comprobar respuesta (${selected.length}/${q.maxSelect})
                            </button>
                        ` : ''}

                        ${state.selectedAnswer !== null && state.isAnswerCorrect === false ? `
                            <div class="mt-6 p-5 bg-amber-50 border border-amber-200 rounded-xl">
                                <p class="font-bold text-amber-800 mb-2">Explicación:</p>
                                <p class="text-slate-700">${q.explanation}</p>
                            </div>
                            <button onclick="nextQuestion()" class="mt-6 w-full bg-emerald-600 text-white py-4 rounded-xl font-bold hover:bg-emerald-700 transition-all">
                                Siguiente pregunta
                            </button>
                        ` : ''}
                    </div>
                </div>`;
            }

            if (state.view === 'results') {
                const scorePerc = Math.round((state.score / state.activeQuestions.length) * 100);
                app.innerHTML = `
                <div class="max-w-md mx-auto text-center animate-fade-in bg-white p-12 rounded-[3rem] shadow-2xl">
                    <h2 class="text-2xl font-black mb-2">${state.studentName}</h2>
                    <p class="text-slate-400 uppercase text-xs font-bold mb-6">${state.currentMode}</p>
                    <div class="text-7xl font-black text-emerald-600 mb-4">${scorePerc}%</div>
                    <p class="text-lg font-bold text-slate-700 mb-10">${state.score} / ${state.activeQuestions.length} correctas</p>
                    <button onclick="location.reload()" class="w-full bg-slate-900 text-white py-4 rounded-xl font-bold">VOLVER AL INICIO</button>
                    <p class="mt-6 text-xs font-bold text-slate-400">
                        ${state.emailStatus === 'success' ? '✅ Nota e imagen enviadas al correo' :
                          state.emailStatus === 'error' ? '⚠️ Error al enviar nota e imagen' :
                          '⏳ Enviando nota e imagen al correo...'}
                    </p>
                </div>`;
            }
        }
        render();
    </script>
</body>
</html>
